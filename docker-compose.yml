services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: paypal-gift-memory-card:local
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/auth/me"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
